<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102c50">
  <title>Abarrotes Gema | Punto de Venta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <!-- Estilos: base compartida + uno por módulo -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="modules/auth/auth.css">
  <link rel="stylesheet" href="modules/sales/sales.css">
  <link rel="stylesheet" href="modules/cash/cash.css">
</head>
<body>
  <div id="login" class="login hidden"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🛒 Abarrotes<br><span>Gema</span></div>
      <nav id="nav" class="navlist"></nav>
      <div class="sidefoot" id="sideFoot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="status" id="connBadge"></div>
        <div class="status" id="pendingBadge"></div>
        <div class="spacer"></div>
        <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
        <button id="logoutBtn">Salir</button>
      </header>
      <div class="content" id="view"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <!-- 1) Núcleo -->
  <script src="core/store.js"></script>

  <!-- 2) Datos y reglas de cada módulo (se conectan a Store) -->
  <script src="modules/inventory/inventory.data.js"></script>
  <script src="modules/cash/cash.data.js"></script>
  <script src="modules/sales/sales.data.js"></script>
  <script src="modules/users/users.data.js"></script>

  <!-- 3) Interfaz: núcleo y luego cada módulo (si uno falla, los demás siguen) -->
  <script src="core/app.js"></script>
  <script src="modules/auth/auth.js"></script>
  <script src="modules/sales/sales.js"></script>
  <script src="modules/inventory/inventory.js"></script>
  <script src="modules/cash/cash.js"></script>
  <script src="modules/reports/reports.js"></script>
  <script src="modules/users/users.js"></script>
  <script src="modules/settings/settings.js"></script>

  <!-- 4) Arranque -->
  <script src="core/boot.js"></script>
</body>
</html>
